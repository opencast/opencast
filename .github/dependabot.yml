version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly

# JavaScript dependencies
- package-ecosystem: npm
  directory: "/docs/guides"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/docs/checkstyle/eslint-config"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/modules/engage-ui"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/modules/lti"
  schedule:
    interval: monthly
  groups:
    minor-and-patch:
      update-types:
        - minor
        - patch
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/modules/runtime-info-ui"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/modules/engage-paella-player-8"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10

# Java dependencies
- package-ecosystem: maven
  directory: "/modules/metrics-exporter"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: maven
  directory: /modules/db
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: maven
  directory: /modules/elasticsearch-impl
  schedule:
    interval: monthly
  groups:
    # httpclient5, httpcore5, httpcore5-h2 and httpcore5-reactive are released
    # in lockstep and must be bumped together
    httpcomponents:
      patterns:
        - "org.apache.httpcomponents.*"
    httpcomponents-security:
      applies-to: security-updates
      patterns:
        - "org.apache.httpcomponents.*"
  open-pull-requests-limit: 10
