name: Tests » Paella 7

on:
  pull_request:
    paths:
      - '.github/workflows/test-paella-7.yml'
      - 'modules/engage-paella-player-7/**'
  push:
    paths:
      - '.github/workflows/test-paella-7.yml'
      - 'modules/engage-paella-player-7/**'
    branches-ignore:
      - 'opencast-auto-forward-merge/**' # Don't run on auto forward merges, as they should be triggered by workflow_call.
  workflow_call:
    inputs:
      ref:
        required: false
        type: string


jobs:
  test-paella:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./modules/engage-paella-player-7
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.ref }}
        fetch-depth: 0
    - name: (DEBUG-INFO) Print checked-out HEAD commit (child workflow)
      if: github.event_name == 'workflow_call'
      run: |
        echo "CHILD_WORKFLOW_HEAD=$(git rev-parse HEAD)"
        echo "GITHUB_SHA=${{ github.sha }}"

    - uses: actions/setup-node@v6
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: playwright-report
        path: ./modules/engage-paella-player-7/playwright-report/
        retention-days: 30
        overwrite: true
