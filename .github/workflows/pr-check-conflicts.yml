name: PRs » Merge conflict check
on:
  push:
    branches:
      - develop
      - 'r/*'
  pull_request_target:
    types:
      - opened
      - synchronize

# The action checks all open pull requests on every run. Concurrent runs each
# work with their own snapshot of the labels and may comment on the same pull
# request twice, so make sure only one run is active at a time.
concurrency:
  group: merge-conflict-check
  cancel-in-progress: false

jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    steps:
      - name: Check for dirty pull requests
        uses: eps1lon/actions-label-merge-conflict@releases/2.x
        with:
          dirtyLabel: has-conflicts
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: |
              This pull request has conflicts ☹
              Please resolve those so we can review the pull request.
              Thanks.
