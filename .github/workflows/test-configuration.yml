name: Test configuration

on:
  pull_request:
    paths:
      - '.github/workflows/test-configuration.yml'
      - 'etc/**'
      - 'docs/checkstyle/check-config.sh'
      - '**/pom.xml'
  push:
    paths:
      - '.github/workflows/test-configuration.yml'
      - 'etc/**'
      - 'docs/checkstyle/check-config.sh'
      - '**/pom.xml'

jobs:
  main:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: check configuration
      run: ./docs/checkstyle/check-config.sh
