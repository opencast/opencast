name: Tests » LTI Tools

on:
  pull_request:
    paths:
      - .github/workflows/test-lti-tools.yml
      - modules/lti/**
  push:
    paths:
      - .github/workflows/test-lti-tools.yml
      - modules/lti/**
    branches-ignore:
      - 'opencast-auto-forward-merge/**' # Don't run on auto forward merges, as they should be triggered by workflow_call.
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  test-lti:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.ref }}
        fetch-depth: 0
    - name: (DEBUG-INFO) Print checked-out HEAD commit (child workflow)
      if: github.event_name == 'workflow_call'
      run: |
        echo "CHILD_WORKFLOW_HEAD=$(git rev-parse HEAD)"
        echo "GITHUB_SHA=${{ github.sha }}"

    - name: set up python
      uses: actions/setup-python@v6
      with:
        python-version: 3.13

    - name: install javascript dependencies
      working-directory: modules/lti/
      run: npm ci

    - name: install selenium
      working-directory: modules/lti/
      run: pip install -r requirements.txt

    - name: running selenium tests
      working-directory: modules/lti/
      run: ./selenium-tests
