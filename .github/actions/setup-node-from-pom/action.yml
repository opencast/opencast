name: Set up Node.js from pom.xml
description: Install the Node.js version declared as <node.version> in the root pom.xml

runs:
  using: composite
  steps:
    - name: determine node.js version
      id: pom
      shell: bash
      run: |
        set -eu
        version="$(sed -n 's/.*<node\.version>v\{0,1\}\([^<]*\)<.*/\1/p' pom.xml | head -n1)"
        test -n "${version}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.pom.outputs.version }}
