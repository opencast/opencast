services:
  opensearch:
    extends:
      file: docker-compose.yml
      service: opensearch
  mariadb:
    image: docker.io/library/mariadb:11
    ports:
      - 127.0.0.1:3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: opencast
      MYSQL_DATABASE: opencast
      MYSQL_USER: opencast
      MYSQL_PASSWORD: dbpassword
