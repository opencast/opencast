# Basic statistics data-completeness threshold.
#
# Statistical data may be incomplete or missing entirely before statistics tracking existed, or before a change
# to how it works. By default, the threshold used to hedge this to users is the date statistics tracking first started
# up on this server.
#
# Uncomment and set this to override that default with a specific date (ISO format, e.g. 2026-08-28).
#completeness.threshold.date=2026-08-28

# Limits for what clients can send to the client push endpoint, which can be used by everybody. Requests that are above
# a limit are ignored. The client is not told, it gets the same answer as for any other request.
#
# The limits are in bytes: the size of a single request, and the size of all the requests of one IP address within a
# minute and within an hour. 0 means there is no limit.
#
# The limits are kept in memory. Restarting a node resets them, and nodes count on their own.
#
# Defaults: 8 KiB per request, 512 KiB per minute and 8 MiB per hour.
#ratelimit.request.bytes=8192
#ratelimit.minute.bytes=524288
#ratelimit.hour.bytes=8388608
