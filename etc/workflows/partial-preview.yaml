id: partial-preview
title: Prepare preview artifacts
state-mappings:
  - state: running
    value: EVENTS.EVENTS.STATE_MAPPING.UPDATING_PREVIEWS
  - state: failing
    value: EVENTS.EVENTS.STATE_MAPPING.UPDATING_PREVIEWS
operations:
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Preview movies

  # Based on the source artifacts, extract preview versions.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Analyze media assets
  - id: analyze-tracks
    exception-handler-workflow: partial-error
    description: Analyze tracks in media package and set control variables
    configurations:
      - source-flavor: '*/source'

  # Transcode video previews
  - id: encode
    if: ((${presenter_source_video} OR ${presentation_source_video}))
    exception-handler-workflow: partial-error
    description: Create single-stream video preview
    configurations:
      - source-flavors: '*/source'
      - target-flavor: '*/preview'
      - target-tags: preview
      - encoding-profile: mp4-preview.http

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Audio waveform

  # Create the waveform.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: waveform
    exception-handler-workflow: partial-error
    description: Generating waveform
    configurations:
      - source-flavor: '*/source'
      - target-flavor: '*/waveform'
      - target-tags: preview

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Track previews

  # Create track previews for video editor stream selection feature
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: image
    exception-handler-workflow: partial-error
    description: Create video preview images for presenter and presentation
    configurations:
      - source-flavor: '*/source'
      - target-flavor: '*/video+preview'
      - target-tags: preview
      - encoding-profile: editor.tracks.preview
      - time: 50%

  - id: cover-image
    if: (NOT(${presenter_source_video} OR $ ${presentation_source_video}))
    description: Create a cover image for audio-only files
    configurations:
      - stylesheet: file://${karaf.etc}/branding/coverimage.xsl
      - width: 1920
      - height: 1080
      - target-flavor: presenter/image+work

  - id: image-to-video
    if: (NOT(${presenter_source_video} OR $ ${presentation_source_video}))
    description: Composite
    configurations:
      - source-flavor: presenter/image+work
      - target-flavor: '*/video+work'
      - duration: ${presenter_source_duration}
      - profile: image-movie.work

  - id: prepare-av
    if: (NOT(${presenter_source_video} OR $ ${presentation_source_video}))
    description: Preparing presenter audio and video work versions
    configurations:
      - source-flavor: presenter/video+work
      - target-flavor: presenter/preview
      - rewrite: false
      - audio-muxing-source-flavors: '*/source'

  - id: tag
    description: Tagging media package elements
    configurations:
      - source-flavors: presenter/preview
      - target-tags: preview
      - copy: false

  - id: waveform
    fail-on-error: false
    description: Generating audio preview waveform
    configurations:
      - source-flavor: '*/source'
      - target-flavor: '*/audio+preview'
      - target-tags: preview
      - min-width: 688
      - max-width: 688
      - height: 58

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Silence detection

  # Run silence detection to provide hints to the video editor.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Run silence detection
  - id: silence
    if: NOT ${straightToPublishing}
    fail-on-error: false
    description: Detecting silence
    configurations:
      - source-flavors: '*/preview'
      - smil-flavor-subtype: silence
      - reference-tracks-flavor: '*/source'

  # Tag the results for internal publishing
  # Fixme: remove once "silence" operation supports target-tags
  - id: tag
    if: NOT ${straightToPublishing}
    description: Preparing silence detection for preview
    configurations:
      - source-flavors: '*/silence'
      - target-tags: +archive

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish previews

  # Distributing preview artifacts to preview publication channel.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish previews
  - id: publish-configure
    exception-handler-workflow: partial-error
    description: Publish to editor
    configurations:
      - download-source-tags: preview,editor
      - channel-id: internal
      - url-pattern: ${org_org_opencastproject_admin_ui_url!'http://localhost:8080'}/editor-ui/index.html?id=${event_id}
      - check-availability: false
