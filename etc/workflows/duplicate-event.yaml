id: duplicate-event
title: Duplicate Event
tags:
  - archive
displayOrder: 10
state-mappings:
  - state: running
    value: EVENTS.EVENTS.STATE_MAPPING.DUPLICATING
  - state: failing
    value: EVENTS.EVENTS.STATE_MAPPING.DUPLICATING
configuration_panel_json: |2-

      [
        {
          "description": "Title of Duplicate:",
          "fieldset": [
            {
              "name": "mpTitle",
              "type": "text",
              "value": " "
            }
          ]
        },
        {
          "description": "Series Id:",
          "fieldset": [
              {
              "name": "seriesId",
              "type": "text",
              "value": " "
            }
          ]
        },
        {
          "description": "Insert the number of duplicated events",
          "fieldset": [
            {
              "name": "numberOfEvents",
              "type": "number",
              "label": "Number of Events",
              "min": "1",
              "max": "25",
              "value": "1"
            }
          ]
        },
        {
          "fieldset": [
            {
              "name": "noCopySuffix",
              "type": "checkbox",
              "label": "Do not use copy suffix",
              "value": false
            }
          ]
        }
      ]
    
operations:
  # Create the new events
  - id: duplicate-event
    exception-handler-workflow: partial-error
    description: Duplicate Event
    configurations:
      - source-flavors: '*/*'
      - number-of-events: ${numberOfEvents}
      - set-series-id: ${seriesId}
      - set-title: ${mpTitle}
      - set-start-date-time: ${startDateTime}
      - target-tags: ''
      - property-namespaces: 
          org.opencastproject.assetmanager.security,org.opencastproject.workflow.configuration
      - no-suffix: ${noCopySuffix}
      - copy-number-prefix: copy
  - id: start-workflow
    configurations:
      - media-packages: ${duplicate_media_package_ids}
      - workflow-definition: fast
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Remove temporary processing artifacts
    configurations:
      # On systems with shared workspace or working file repository
      # you want to set this option to false.
      - delete-external: true
      # ACLs are required again when working through ActiveMQ messages
      - preserve-flavors: security/*
