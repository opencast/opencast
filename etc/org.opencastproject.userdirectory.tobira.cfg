# Tobira User Provider Configuration
#
# This provider enables Opencast to look up user information from Tobira.
# When Tobira sets ACL entries with user roles (e.g., ROLE_USER_JOHN),
# this provider allows Opencast to resolve the corresponding user's
# display name, email, and other information.
#
# Configuration requires both the Tobira URL and a shared trusted external
# key (matching Tobira's auth.trusted_external_key config).

# The organization this user provider applies to
#org.opencastproject.userdirectory.tobira.org=mh_default_org

# The base URL of the Tobira instance (e.g., https://tobira.example.com)
#org.opencastproject.userdirectory.tobira.url=http://localhost:3080

# The trusted external key shared between Opencast and Tobira.
# Must match the auth.trusted_external_key value in Tobira's configuration.
#org.opencastproject.userdirectory.tobira.trustedKey=tobira

# Maximum number of users to keep in cache (default: 500)
#org.opencastproject.userdirectory.tobira.cache.size=500

# Number of minutes before cached user data expires (default: 60)
#org.opencastproject.userdirectory.tobira.cache.expiration=60
