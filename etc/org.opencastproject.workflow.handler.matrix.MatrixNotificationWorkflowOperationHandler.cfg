# Configuration for the Matrix Notification Workflow Operation Handler

# The Matrix server URL (e.g., https://matrix.org)
# Default: https://matrix.org
#matrix.server.url=https://matrix.org

# The Matrix access token for authentication
# Default: (none)
#matrix.access.token=

# The maximal attempts for the notification request
# Default: 5
#matrix.max.retry=5

# The request timeout in seconds
# Default: 10
#matrix.timeout=10
