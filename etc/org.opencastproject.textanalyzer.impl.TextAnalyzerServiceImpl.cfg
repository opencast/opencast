#The approximate load placed on the system by creating a text analysis job
#Each job converts the image for OCR if necessary, then extracts the text from the image
#Since this will fairly quickly add up, these should be relatively expensive, but not cripplingly so
# Default: 0.2
#job.load.analysis=0.2

# Filter the texts extracted from slides, etc. If enabled, the regular expression
# configured as filter.pattern is applied to the extracted text as many times as
# it matches, and only the matches are kept, separated by a space character.
# Lines without any match are dropped. If disabled, the extracted text is used
# as it is, apart from dropping empty lines.
# Default: true
#filter.enabled=true

# The regular expression used to filter the extracted texts. The default
# expression “\w+” only lets upper- and lowercase letters (a-zA-Z), digits and
# the underscore pass. The following expression would also let German special
# characters and punctuation (at the end of a word) pass through:
#   filter.pattern=[\\wäöüÄÖÜß][\\wäöüÄÖÜß]+[-.,:;!]*
# Note the double-escaping of the backslash.
# Default: \w+
#filter.pattern=\\w+
